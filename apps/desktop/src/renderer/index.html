<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Virtual Shock</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header class="brand">
        <div class="logo-wrap">
          <img
            class="logo"
            src="./logo.png"
            width="64"
            height="64"
            alt="Virtual Shock"
          />
        </div>
        <h1>Virtual Shock</h1>
        <p class="subtitle">Host local — controle pelo celular</p>
      </header>

      <section class="card card-hero">
        <div class="qr-wrap">
          <img id="qr" alt="QR Code de conexão" hidden />
          <p id="qr-fallback" class="hint">QR indisponível</p>
        </div>

        <p class="code-label">Código de pareamento</p>
        <p id="code" class="code-value">------</p>

        <div id="status-pill" class="status-pill is-waiting">
          <span class="dot" aria-hidden="true"></span>
          <strong id="status">—</strong>
        </div>

        <p class="hint url-hint">
          No celular (horizontal), abra
          <code id="url">http://IP:porta/</code>
        </p>

        <button id="rotate" type="button">Gerar novo código</button>
      </section>

      <section class="card card-gamepad" id="gamepad-card">
        <div class="gamepad-head">
          <span class="label">Gamepad virtual</span>
          <strong id="gamepad-status">—</strong>
        </div>
        <p id="gamepad-detail" class="hint"></p>
        <button id="retry-gamepad" type="button" class="btn-ghost">
          Instalar / reconectar ViGEm
        </button>
      </section>

      <section class="card card-meta">
        <div class="stat">
          <span class="label">Porta</span>
          <strong id="port">—</strong>
        </div>
        <div class="stat">
          <span class="label">IPs</span>
          <strong id="ips">—</strong>
        </div>
      </section>

      <p class="notes">
        Mesma Wi‑Fi · celular na horizontal · ViGEmBus na 1ª vez (UAC)
      </p>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
